<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>西北太平洋台风模拟器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css?v=20261027i" />
</head>
<body>
  <header class="site-header">
    <h1>西北太平洋台风模拟器</h1>
    <p class="subtitle">西北太平洋热带气旋路径与强度 · 副高引导 · 简易业务台站</p>
  </header>

  <div class="layout">
    <aside class="sidebar">

      <section class="panel" id="panel-init">
        <h2 class="panel-title">初始条件 <span class="badge">台风中心</span></h2>
        <p class="hint" style="margin:0 0 0.6rem;font-size:0.85rem;color:#6a7a8a">点击地图放置台风中心</p>
        <div class="form-row">
          <label for="initWindGrade">风力等级</label>
          <select id="initWindGrade" title="按中国风力等级设定初始强度">
            <option value="17.2">8级 (17.2 m/s)</option>
            <option value="20.8">9级 (20.8 m/s)</option>
            <option value="24.5">10级 (24.5 m/s)</option>
            <option value="28.5">11级 (28.5 m/s)</option>
            <option value="32.7" selected>12级 (32.7 m/s)</option>
            <option value="37.0">13级 (37.0 m/s)</option>
            <option value="41.5">14级 (41.5 m/s)</option>
            <option value="46.2">15级 (46.2 m/s)</option>
            <option value="51.0">16级 (51.0 m/s)</option>
            <option value="56.1">17级 (56.1 m/s)</option>
          </select>
        </div>
      </section>

      <section class="panel panel-sticky" id="panel-run">
        <h2 class="panel-title">运行控制</h2>
        <div class="btn-row">
          <button type="button" class="primary" id="btnStart" title="开始或继续模拟">开始</button>
          <button type="button" class="secondary" id="btnPause" disabled title="暂停 / 继续">暂停</button>
          <button type="button" class="secondary" id="btnReset" title="清空路径并回到待启动">重置</button>
        </div>
      </section>

      <section class="panel" id="panel-status">
        <h2 class="panel-title">实时状态</h2>
        <div class="status-panel" id="statusPanel">
          <div class="st-section">观测要素</div>
          <div class="st-row"><span class="st-label">时间</span><span class="st-value" id="stTime">—</span></div>
          <div class="st-row"><span class="st-label">位置</span><span class="st-value mono" id="stPos">—</span></div>
          <div class="st-row"><span class="st-label">最大风速</span><span class="st-value wind" id="stWind">—</span></div>
          <div class="st-row"><span class="st-label">海温（SST）</span><span class="st-value sst" id="stSst">—</span></div>
          <div class="st-row"><span class="st-label">阶段</span><span class="st-value phase" id="stPhase">待启动</span></div>
          <div class="st-section">引导场</div>
          <div class="st-row"><span class="st-label">引导气流</span><span class="st-value mono" id="stSteer">—</span></div>
        </div>
      </section>



      <section class="panel" id="panel-fugen">
        <h2 class="panel-title">副热带高压</h2>
        <div class="form-row">
          <label for="fugenMonth">气候月份</label>
          <select id="fugenMonth" title="选择副高气候态；黄线随副高北缘季节北跳/南撤">
            <option value="6">6月 · 黄线江南</option>
            <option value="7" selected>7月 · 黄线黄淮</option>
            <option value="8">8月 · 黄线华北</option>
            <option value="9">9月 · 黄线南撤江南</option>
          </select>
        </div>
        <p class="hint" style="margin:0.35rem 0 0.55rem;font-size:0.8rem;color:#6a7a8a">黄线以南一整块副高；体内靠空圈进路；换月只改场，不自动开跑</p>
        <div class="btn-row tight">
          <button type="button" class="secondary" id="btnResetFugen" title="恢复当前月份气候态副高">恢复本月默认</button>
        </div>
        <div class="fugen-list" id="fugenList"></div>
      </section>

    </aside>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-toolbar" id="mapToolbar" title="操作提示">
        操作：点击地图落点 · 选风力/副高月份 ·「开始」积分
      </div>
      <div class="clock-bar" id="clockBar">模拟时钟：未开始 · 点击地图放置台风后按「开始」</div>
      <div class="map-legend">
        <div class="legend-title">图例 · 业务要素</div>
        <div class="legend-sec">环境场</div>
        <div><span class="swatch" style="background:#d35400;opacity:0.55"></span>副热带高压</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #d68910"></span>SST 26.5℃</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #922b21"></span>SST 28℃</div>
        <div><span class="swatch" style="background:#8b7355;opacity:0.5"></span>山地示意</div>
        <div class="legend-sec">台风</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #2471a3"></span>7级风圈</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #d68910"></span>10级风圈</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #c0392b"></span>12级风圈</div>
        <div><span class="swatch" style="background:#1a5276"></span>台风路径</div>
        <div class="legend-sec">引导</div>
        <div><span class="swatch" style="background:transparent;border:2px dashed #1e8449"></span>副高北缘（绿线）</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/geo.js?v=20261027i"></script>
  <script src="js/physics.js?v=20261027i"></script>
  <script src="js/app.js?v=20261027i"></script>
</body>
</html>
