<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>西北太平洋台风模拟器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css?v=20261031b" />
</head>
<body>
  <header class="site-header">
    <h1>西北太平洋台风模拟器</h1>
  </header>

  <div class="layout">
    <aside class="sidebar">

      <section class="panel panel-mode" id="panel-mode">
        <h2 class="panel-title">工作模式 <span class="badge">台站</span></h2>
        <div class="btn-row tight mode-row">
          <button type="button" class="primary mode-btn is-active" id="btnModeSim">模拟</button>
          <button type="button" class="secondary mode-btn" id="btnModeHistory">台风纪录</button>
        </div>
      </section>

      <section class="panel" id="panel-init">
        <h2 class="panel-title">初始条件 <span class="badge">台风中心</span></h2>
        <div class="form-row">
          <label for="initWindGrade">风力等级</label>
          <select id="initWindGrade">
            <option value="17.2">8级 (17.2 m/s)</option>
            <option value="20.8">9级 (20.8 m/s)</option>
            <option value="24.5">10级 (24.5 m/s)</option>
            <option value="28.5">11级 (28.5 m/s)</option>
            <option value="32.7" selected>12级 (32.7 m/s)</option>
            <option value="37.0">13级 (37.0 m/s)</option>
            <option value="41.5">14级 (41.5 m/s)</option>
            <option value="46.2">15级 (46.2 m/s)</option>
            <option value="51.0">16级 (51.0 m/s)</option>
            <option value="56.1">17级 (56.1 m/s)</option>
            <option value="61.0">&gt;17级 · Cat4 (61.0 m/s)</option>
            <option value="70.5">&gt;17级 · Cat5 (70.5 m/s)</option>
            <option value="80.0">&gt;17级 · Cat5+ (80.0 m/s)</option>
          </select>
        </div>
        <div class="form-row">
          <label for="intensityScale">强度色阶</label>
          <select id="intensityScale">
            <option value="cma" selected>中国 · CMA</option>
            <option value="sshws">美国 · SSHWS</option>
          </select>
        </div>
      </section>

      <section class="panel panel-sticky" id="panel-run">
        <h2 class="panel-title">运行控制</h2>
        <div class="btn-row">
          <button type="button" class="primary" id="btnStart">开始</button>
          <button type="button" class="secondary" id="btnPause" disabled>暂停</button>
          <button type="button" class="secondary" id="btnReset">重置</button>
        </div>
        <div class="timeline-scrub" id="timelineScrub">
          <div class="timeline-head">
            <label for="scrubRange">时间轴</label>
            <span class="timeline-day" id="scrubDayLabel">Day 0</span>
          </div>
          <input type="range" id="scrubRange" min="0" max="0" value="0" step="1" disabled />
          <div class="timeline-ends">
            <span>Day 0</span>
            <span id="scrubMaxLabel">Day 0</span>
          </div>
        </div>
      </section>

      <section class="panel" id="panel-fugen">
        <h2 class="panel-title">副热带高压</h2>
        <div class="form-row">
          <label for="fugenMonth">气候月份</label>
          <select id="fugenMonth">
            <option value="6">6月</option>
            <option value="7" selected>7月</option>
            <option value="8">8月</option>
            <option value="9">9月</option>
          </select>
        </div>
        <div class="btn-row tight">
          <button type="button" class="secondary" id="btnResetFugen">恢复本月默认</button>
        </div>
        <div class="fugen-list" id="fugenList"></div>
      </section>

      <section class="panel" id="panel-cold">
        <h2 class="panel-title">冷空气强度</h2>
        <div class="form-row cold-seg-row">
          <label for="coldSeg0">0–5天</label>
          <input type="range" id="coldSeg0" min="0" max="5" value="3" step="1" />
          <span class="val" id="coldSeg0Val">3</span>
        </div>
        <div class="form-row cold-seg-row">
          <label for="coldSeg1">5–10天</label>
          <input type="range" id="coldSeg1" min="0" max="5" value="3" step="1" />
          <span class="val" id="coldSeg1Val">3</span>
        </div>
        <div class="form-row cold-seg-row">
          <label for="coldSeg2">10–15天</label>
          <input type="range" id="coldSeg2" min="0" max="5" value="3" step="1" />
          <span class="val" id="coldSeg2Val">3</span>
        </div>
        <div class="range-ends cold-seg-ends" aria-hidden="true">
          <span>弱</span>
          <span>强</span>
        </div>
      </section>

      <section class="panel panel-history" id="panel-history">
        <h2 class="panel-title">台风纪录 <span class="badge">IBTrACS</span></h2>
        <div class="form-row">
          <label for="histYear">年份</label>
          <select id="histYear"></select>
        </div>
        <div class="form-row">
          <label for="histStorm">台风</label>
          <select id="histStorm">
            <option value="">（全部）</option>
          </select>
        </div>
        <div class="btn-row tight">
          <button type="button" class="secondary" id="btnHistFit">定位</button>
          <button type="button" class="secondary" id="btnHistClear">全部</button>
          <button type="button" class="secondary" id="btnHistBack">返回模拟</button>
        </div>
        <p class="hint" id="histStatus" hidden></p>
        <div class="hist-meta" id="histMeta"></div>
      </section>

    </aside>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-toolbar" id="mapToolbar" hidden></div>
      <div class="clock-bar" id="clockBar">模拟时钟：未开始</div>
      <div class="map-legend">
        <div class="legend-title">图例</div>
        <div class="legend-sec legend-sim-only">环境场</div>
        <div class="legend-sim-only"><span class="swatch" style="background:#d35400;opacity:0.55"></span>副热带高压</div>
        <div class="legend-sim-only"><span class="swatch" style="background:transparent;border:2px solid #d68910"></span>SST 26.5℃</div>
        <div class="legend-sim-only"><span class="swatch" style="background:transparent;border:2px solid #922b21"></span>SST 28℃</div>
        <div><span class="swatch" style="background:#8b7355;opacity:0.5"></span>山地示意</div>
        <div class="legend-sec">台风</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #2471a3"></span>7级风圈</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #d68910"></span>10级风圈</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #c0392b"></span>12级风圈</div>
        <div><span class="swatch" style="background:#1a5276"></span>台风路径</div>
        <div id="intensityLegendItems">
          <div><span class="swatch" style="background:#008000;border-radius:50%"></span>TD 热带低压</div>
          <div><span class="swatch" style="background:#0000FF;border-radius:50%"></span>TS 热带风暴</div>
          <div><span class="swatch" style="background:#FFFF00;border-radius:50%"></span>STS 强热带风暴</div>
          <div><span class="swatch" style="background:#FFA500;border-radius:50%"></span>TY 台风</div>
          <div><span class="swatch" style="background:#800080;border-radius:50%"></span>STY 强台风</div>
          <div><span class="swatch" style="background:#FF0000;border-radius:50%"></span>Super 超强台风</div>
        </div>
        <div class="legend-sec legend-sim-only">引导</div>
        <div class="legend-sim-only"><span class="swatch" style="background:transparent;border:2px dashed #1e8449"></span>副高北缘（绿线）</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/land-mask-data.js?v=20261031b"></script>
  <script src="js/geo.js?v=20261031b"></script>
  <script src="js/physics.js?v=20261031b"></script>
  <script src="js/history.js?v=20261031b"></script>
  <script src="js/app.js?v=20261031b"></script>
</body>
</html>
