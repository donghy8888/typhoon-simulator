<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>西北太平洋台风模拟器</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css?v=20261025p" />
</head>
<body>
  <header class="site-header">
    <h1>西北太平洋台风模拟器</h1>
    <p class="subtitle">西北太平洋热带气旋路径与强度模拟</p>
  </header>

  <div class="layout">
    <aside class="sidebar">

      <section class="panel" id="panel-init">
        <h2 class="panel-title">初始条件 <span class="badge">台风中心</span></h2>
        <div class="form-row">
          <label for="initLon">经度</label>
          <input type="number" id="initLon" value="140" step="0.1" min="100" max="180" title="东经 100–180°" />
          <span class="unit">°E</span>
        </div>
        <div class="form-row">
          <label for="initLat">纬度</label>
          <input type="number" id="initLat" value="15" step="0.1" min="0" max="50" title="北纬 0–50°" />
          <span class="unit">°N</span>
        </div>
        <div class="form-row">
          <label for="initWind">最大风速</label>
          <input type="number" id="initWind" value="35" step="0.5" min="14" max="70" />
          <span class="unit">m/s</span>
        </div>
        <div class="form-row">
          <label for="initWindGrade">或风力等级</label>
          <select id="initWindGrade" title="按中国风力等级对照填入风速">
            <option value="">— 对照选择 —</option>
            <option value="17.2">8级 (17.2 m/s)</option>
            <option value="20.8">9级 (20.8 m/s)</option>
            <option value="24.5">10级 (24.5 m/s)</option>
            <option value="28.5">11级 (28.5 m/s)</option>
            <option value="32.7">12级 (32.7 m/s)</option>
            <option value="37.0">13级 (37.0 m/s)</option>
            <option value="41.5">14级 (41.5 m/s)</option>
            <option value="46.2">15级 (46.2 m/s)</option>
            <option value="51.0">16级 (51.0 m/s)</option>
            <option value="56.1">17级 (56.1 m/s)</option>
          </select>
        </div>
      </section>

      <section class="panel panel-sticky" id="panel-run">
        <h2 class="panel-title">运行控制</h2>
        <div class="btn-row">
          <button type="button" class="primary" id="btnStart" title="开始或继续模拟">开始</button>
          <button type="button" class="secondary" id="btnPause" disabled title="暂停 / 继续">暂停</button>
          <button type="button" class="secondary" id="btnReset" title="清空路径并回到待启动">重置</button>
        </div>
        <div class="form-row">
          <label for="simSpeed">播放速度</label>
          <input type="range" id="simSpeed" min="1" max="20" value="4" />
          <span class="val" id="simSpeedVal">4×</span>
        </div>
        <div class="form-row">
          <label for="ensembleN">集合成员</label>
          <input type="number" id="ensembleN" value="1" min="1" max="20" step="1" title="1–20；大于 1 时叠加扰动路径" />
          <span class="unit">个</span>
        </div>
      </section>

      <section class="panel" id="panel-status">
        <h2 class="panel-title">实时状态</h2>
        <div class="status-panel" id="statusPanel">
          <div class="st-row"><span class="st-label">时间</span><span class="st-value" id="stTime">—</span></div>
          <div class="st-row"><span class="st-label">位置</span><span class="st-value" id="stPos">—</span></div>
          <div class="st-row"><span class="st-label">最大风速</span><span class="st-value" id="stWind">—</span></div>
          <div class="st-row"><span class="st-label">海温（SST）</span><span class="st-value" id="stSst">—</span></div>
          <div class="st-row"><span class="st-label">阶段</span><span class="st-value phase" id="stPhase">待启动</span></div>
          <div class="st-row"><span class="st-label">引导气流</span><span class="st-value" id="stSteer">—</span></div>
        </div>
      </section>

      <section class="panel" id="panel-layers">
        <h2 class="panel-title">图层</h2>
        <div class="checkbox-list" id="layerToggles">
          <label title="副热带高压多边形，可拖动编辑"><input type="checkbox" data-layer="fugen" checked /> 副热带高压</label>
          <label title="各海域海温填色与 26.5 / 28℃ 阈值边框"><input type="checkbox" data-layer="sst" checked /> 海温关键等值线 (26.5 / 28℃)</label>
          <label title="大尺度引导风向示意箭头"><input type="checkbox" data-layer="steer" checked /> 引导风向箭头</label>
          <label title="陆地轮廓与山地示意（影响摩擦衰减）"><input type="checkbox" data-layer="terrain" checked /> 陆地 / 山地示意</label>
          <label title="主台风路径与风圈"><input type="checkbox" data-layer="track" checked /> 台风路径与风圈</label>
          <label title="集合成员扰动路径（意大利面条图）"><input type="checkbox" data-layer="ensemble" checked /> 集合预报路径</label>
        </div>
      </section>

      <section class="panel" id="panel-sst">
        <h2 class="panel-title">海温 <span class="badge">SST</span></h2>
        <div id="sstControls"></div>
      </section>

      <section class="panel" id="panel-fugen">
        <h2 class="panel-title">副热带高压</h2>
        <div class="btn-row tight">
          <button type="button" class="secondary" id="btnAddFugen" title="在地图中心添加一块顺滑副高">添加副高块</button>
          <button type="button" class="secondary" id="btnResetFugen" title="恢复默认两块副高">恢复默认</button>
        </div>
        <div class="fugen-list" id="fugenList"></div>
      </section>

      <section class="panel" id="panel-steer">
        <h2 class="panel-title">引导气流</h2>
        <div class="form-row">
          <label for="steerU">纬向 u（东向为正）</label>
          <input type="range" id="steerU" min="-12" max="12" value="-3" step="0.5" />
          <span class="val" id="steerUVal">-3.0</span>
        </div>
        <div class="form-row">
          <label for="steerV">经向 v（北向为正）</label>
          <input type="range" id="steerV" min="-8" max="8" value="1.5" step="0.5" />
          <span class="val" id="steerVVal">1.5</span>
        </div>
        <div class="form-row">
          <label for="westerlyU">副高北侧西风 u</label>
          <input type="range" id="westerlyU" min="0" max="20" value="8" step="0.5" />
          <span class="val" id="westerlyUVal">8.0</span>
        </div>
        <div class="form-row">
          <label for="betaStrength">β 漂移强度</label>
          <input type="range" id="betaStrength" min="0" max="2" value="1" step="0.1" />
          <span class="val" id="betaStrengthVal">1.0</span>
        </div>
      </section>

    </aside>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-toolbar" id="mapToolbar" title="操作提示">
        点击地图放置台风 · 选中副高后拖内部平移、拖圆点改形
      </div>
      <div class="clock-bar" id="clockBar">模拟时钟：未开始 · 点击地图放置台风后按「开始」</div>
      <div class="map-legend">
        <div class="legend-title">图例</div>
        <div><span class="swatch" style="background:#e74c3c;opacity:0.55"></span>副热带高压</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #e67e22"></span>SST 26.5℃</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #922b21"></span>SST 28℃</div>
        <div><span class="swatch" style="background:#8b7355;opacity:0.45"></span>山地示意</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #2980b9"></span>7级风圈</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #e67e22"></span>10级风圈</div>
        <div><span class="swatch" style="background:transparent;border:2px solid #c0392b"></span>12级风圈</div>
        <div><span class="swatch" style="background:#2980b9"></span>台风路径</div>
        <div><span class="swatch" style="background:#95a5a6"></span>集合成员路径</div>
        <div><span class="swatch" style="background:transparent;border:2px dashed #1a7f4b"></span>副高北缘（绿线）</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/geo.js?v=20261025p"></script>
  <script src="js/physics.js?v=20261025p"></script>
  <script src="js/app.js?v=20261025p"></script>
</body>
</html>
